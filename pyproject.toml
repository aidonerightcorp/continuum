[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "2.0.0"
description = "Hermes sizes itself to each Task: Continuum learns from your own sessions which Tasks a cheaper model answers just as well, sends only those there, records every attempt and checks its own choices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "aidonerightcorp"}]
dependencies = []

[tool.setuptools]
packages = ["continuum_core", "continuum_core.rightsize"]
py-modules = ["omninode_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
