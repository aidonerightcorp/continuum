<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c1b19"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a2b"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#f5f2ea"/>
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="none" stroke="#cfc9bb" stroke-width="2"/>

  <text x="64" y="150" font-size="92" font-weight="700" fill="#1c1b19">Continuum</text>
  <text x="66" y="212" font-size="34" fill="#2f5d50" font-weight="700">Hermes sizes itself to each Task</text>
  <text x="66" y="262" font-size="20" fill="#56524a">A plugin for Hermes Agent. It learns from your own sessions which</text>
  <text x="66" y="290" font-size="20" fill="#56524a">Tasks a cheaper model answers just as well, and sends only those there.</text>

  <g font-size="19" fill="#1c1b19">
    <rect x="64" y="386" width="170" height="84" rx="10" fill="#ffffff" stroke="#1c1b19" stroke-width="2"/>
    <text x="149" y="423" text-anchor="middle" font-weight="700">Your message</text>
    <text x="149" y="449" text-anchor="middle" font-size="15" fill="#56524a">a Task</text>

    <rect x="300" y="364" width="250" height="128" rx="10" fill="#1c1b19"/>
    <text x="425" y="404" text-anchor="middle" font-weight="700" fill="#faf8f2">Continuum</text>
    <text x="425" y="432" text-anchor="middle" font-size="15" fill="#e9e5da">fingerprint the Task</text>
    <text x="425" y="454" text-anchor="middle" font-size="15" fill="#e9e5da">read similar records</text>
    <text x="425" y="476" text-anchor="middle" font-size="15" fill="#e9e5da">choose, record, check</text>

    <rect x="640" y="340" width="250" height="76" rx="10" fill="#ffffff" stroke="#2f5d50" stroke-width="2.5"/>
    <text x="765" y="372" text-anchor="middle" font-weight="700" fill="#2f5d50">A cheaper model</text>
    <text x="765" y="397" text-anchor="middle" font-size="15" fill="#56524a">when the records support it</text>

    <rect x="640" y="440" width="250" height="76" rx="10" fill="#ffffff" stroke="#8a5a2b" stroke-width="2.5"/>
    <text x="765" y="472" text-anchor="middle" font-weight="700" fill="#8a5a2b">Your own model</text>
    <text x="765" y="497" text-anchor="middle" font-size="15" fill="#56524a">everything else</text>

    <rect x="976" y="386" width="160" height="84" rx="10" fill="#ffffff" stroke="#1c1b19" stroke-width="2"/>
    <text x="1056" y="423" text-anchor="middle" font-weight="700">Answer</text>
    <text x="1056" y="449" text-anchor="middle" font-size="15" fill="#56524a">to you</text>
  </g>
  <g stroke-width="2.5" fill="none">
    <line x1="238" y1="428" x2="294" y2="428" stroke="#1c1b19" marker-end="url(#a)"/>
    <path d="M554 408 L634 384" stroke="#2f5d50" marker-end="url(#g)"/>
    <path d="M554 450 L634 474" stroke="#8a5a2b" marker-end="url(#b)"/>
    <path d="M894 384 L970 414" stroke="#2f5d50" marker-end="url(#g)"/>
    <path d="M894 474 L970 444" stroke="#8a5a2b" marker-end="url(#b)"/>
  </g>
  <text x="64" y="556" font-size="16" fill="#56524a">Records stay on your machine  •  changes a request only with your consent  •  pure Python, no dependencies</text>
</svg>
