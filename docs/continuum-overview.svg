<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1b19"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/>
    </marker>
    <marker id="arrowBrown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a2b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f2ea"/>
  <rect x="24" y="22" width="1552" height="856" rx="14" fill="none" stroke="#cfc9bb" stroke-width="2"/>

  <!-- header -->
  <rect x="46" y="42" width="1508" height="92" rx="10" fill="#faf8f2" stroke="#2f5d50" stroke-width="2"/>
  <text x="68" y="84" font-size="32" font-weight="700" fill="#1c1b19">Continuum 2.0</text>
  <text x="372" y="84" font-size="28" fill="#1c1b19">Hermes sizes itself to each Task</text>
  <text x="68" y="116" font-size="16" fill="#56524a">A plugin for Hermes Agent  •  learns from your own sessions  •  pure Python, no dependencies  •  no network calls of its own</text>

  <!-- five steps -->
  <text x="48" y="170" font-size="17" font-weight="700" fill="#2f5d50">WHAT HAPPENS IN ONE TURN</text>
  <g font-size="14" fill="#1c1b19">
    <g>
      <rect x="46" y="184" width="282" height="150" rx="8" fill="#faf8f2" stroke="#2f5d50" stroke-width="2"/>
      <text x="62" y="212" font-size="17" font-weight="700" fill="#2f5d50">1  Fingerprint</text>
      <text x="62" y="240">Your message becomes a Task</text>
      <text x="62" y="262">fingerprint with six levels,</text>
      <text x="62" y="284">from exact match to a</text>
      <text x="62" y="306">continuous shape profile.</text>
    </g>
    <g>
      <rect x="352" y="184" width="282" height="150" rx="8" fill="#faf8f2" stroke="#34496b" stroke-width="2"/>
      <text x="368" y="212" font-size="17" font-weight="700" fill="#34496b">2  Find similar Tasks</text>
      <text x="368" y="240">Continuum reads how each of</text>
      <text x="368" y="262">your models did on the most</text>
      <text x="368" y="284">similar Tasks in the record</text>
      <text x="368" y="306">file on your machine.</text>
    </g>
    <g>
      <rect x="658" y="184" width="282" height="150" rx="8" fill="#faf8f2" stroke="#8a5a2b" stroke-width="2"/>
      <text x="674" y="212" font-size="17" font-weight="700" fill="#8a5a2b">3  Choose</text>
      <text x="674" y="240">The cheapest model whose</text>
      <text x="674" y="262">lower bound clears the floor</text>
      <text x="674" y="284">takes the turn. Thin evidence:</text>
      <text x="674" y="306">your own model, and small trials.</text>
    </g>
    <g>
      <rect x="964" y="184" width="282" height="150" rx="8" fill="#faf8f2" stroke="#5b3b6b" stroke-width="2"/>
      <text x="980" y="212" font-size="17" font-weight="700" fill="#5b3b6b">4  Protect the turn</text>
      <text x="980" y="240">A failed attempt that Hermes</text>
      <text x="980" y="262">tries again returns to your own</text>
      <text x="980" y="284">model. A model the provider</text>
      <text x="980" y="306">refuses is blocked.</text>
    </g>
    <g>
      <rect x="1270" y="184" width="284" height="150" rx="8" fill="#faf8f2" stroke="#2f5d50" stroke-width="2"/>
      <text x="1286" y="212" font-size="17" font-weight="700" fill="#2f5d50">5  Record and learn</text>
      <text x="1286" y="240">Every model call and outcome</text>
      <text x="1286" y="262">is stored. Your marks and</text>
      <text x="1286" y="284">checks by your own model</text>
      <text x="1286" y="306">teach the next choice.</text>
    </g>
  </g>
  <g stroke="#1c1b19" stroke-width="2" fill="none">
    <line x1="330" y1="259" x2="349" y2="259" marker-end="url(#arrow)"/>
    <line x1="636" y1="259" x2="655" y2="259" marker-end="url(#arrow)"/>
    <line x1="942" y1="259" x2="961" y2="259" marker-end="url(#arrow)"/>
    <line x1="1248" y1="259" x2="1267" y2="259" marker-end="url(#arrow)"/>
  </g>

  <!-- flow diagram -->
  <rect x="46" y="360" width="900" height="372" rx="10" fill="#faf8f2" stroke="#34496b" stroke-width="2"/>
  <text x="66" y="392" font-size="17" font-weight="700" fill="#34496b">THE LOOP INSIDE HERMES</text>

  <g font-size="15" fill="#1c1b19">
    <rect x="70" y="470" width="150" height="70" rx="8" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
    <text x="145" y="500" text-anchor="middle" font-weight="700">Your message</text>
    <text x="145" y="522" text-anchor="middle" font-size="13" fill="#56524a">a Task</text>

    <rect x="270" y="450" width="190" height="110" rx="8" fill="#1c1b19"/>
    <text x="365" y="486" text-anchor="middle" font-weight="700" fill="#faf8f2">Continuum</text>
    <text x="365" y="510" text-anchor="middle" font-size="13" fill="#e9e5da">fingerprint</text>
    <text x="365" y="530" text-anchor="middle" font-size="13" fill="#e9e5da">similar records</text>
    <text x="365" y="550" text-anchor="middle" font-size="13" fill="#e9e5da">choice</text>

    <rect x="540" y="416" width="200" height="70" rx="8" fill="#ffffff" stroke="#2f5d50" stroke-width="2"/>
    <text x="640" y="446" text-anchor="middle" font-weight="700" fill="#2f5d50">A cheaper model</text>
    <text x="640" y="468" text-anchor="middle" font-size="13" fill="#56524a">when the records support it</text>

    <rect x="540" y="528" width="200" height="70" rx="8" fill="#ffffff" stroke="#8a5a2b" stroke-width="2"/>
    <text x="640" y="558" text-anchor="middle" font-weight="700" fill="#8a5a2b">Your own model</text>
    <text x="640" y="580" text-anchor="middle" font-size="13" fill="#56524a">everything else</text>

    <rect x="800" y="470" width="122" height="70" rx="8" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
    <text x="861" y="500" text-anchor="middle" font-weight="700">Answer</text>
    <text x="861" y="522" text-anchor="middle" font-size="13" fill="#56524a">to you</text>

    <rect x="270" y="636" width="470" height="72" rx="8" fill="#ffffff" stroke="#5b3b6b" stroke-width="2"/>
    <text x="505" y="666" text-anchor="middle" font-weight="700" fill="#5b3b6b">Record file on your machine</text>
    <text x="505" y="690" text-anchor="middle" font-size="13" fill="#56524a">every attempt  •  outcomes  •  held-out records  •  policy log</text>
  </g>
  <g stroke-width="2" fill="none">
    <line x1="222" y1="505" x2="266" y2="505" stroke="#1c1b19" marker-end="url(#arrow)"/>
    <path d="M462 485 L536 455" stroke="#2f5d50" marker-end="url(#arrowGreen)"/>
    <path d="M462 525 L536 558" stroke="#8a5a2b" marker-end="url(#arrowBrown)"/>
    <path d="M742 451 L796 490" stroke="#2f5d50" marker-end="url(#arrowGreen)"/>
    <path d="M742 563 L796 522" stroke="#8a5a2b" marker-end="url(#arrowBrown)"/>
    <line x1="640" y1="488" x2="640" y2="524" stroke="#5b3b6b" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="640" y1="600" x2="640" y2="632" stroke="#1c1b19" marker-end="url(#arrow)"/>
    <path d="M365 634 L365 564" stroke="#1c1b19" marker-end="url(#arrow)"/>
  </g>
  <text x="628" y="511" text-anchor="end" font-size="12.5" fill="#5b3b6b">returns the turn on failure</text>
  <text x="652" y="621" font-size="12.5" fill="#56524a">records</text>
  <text x="377" y="604" font-size="12.5" fill="#56524a">learns</text>

  <!-- why a plugin -->
  <rect x="970" y="360" width="584" height="372" rx="10" fill="#faf8f2" stroke="#8a5a2b" stroke-width="2"/>
  <text x="990" y="392" font-size="17" font-weight="700" fill="#8a5a2b">WHY A PLUGIN, NOT A PROMPT OR A SKILL</text>
  <g font-size="14.5" fill="#1c1b19">
    <text x="990" y="426" font-weight="700">llm_request middleware</text>
    <text x="1210" y="426" fill="#56524a">sets the model of the request</text>
    <text x="990" y="458" font-weight="700">7 lifecycle hooks</text>
    <text x="1210" y="458" fill="#56524a">record every model and tool call</text>
    <text x="990" y="490" font-weight="700">side question</text>
    <text x="1210" y="490" fill="#56524a">your own model checks a sample</text>
    <text x="990" y="522" font-weight="700">continuum_recall tool</text>
    <text x="1210" y="522" fill="#56524a">the agent looks up similar Tasks</text>
    <text x="990" y="554" font-weight="700">/continuum command</text>
    <text x="1210" y="554" fill="#56524a">why, good, bad, pin, audit, forget-text</text>
    <text x="990" y="586" font-weight="700">dashboard and desktop</text>
    <text x="1210" y="586" fill="#56524a">a read-only view of the records</text>
    <text x="990" y="618" font-weight="700">bundled skill</text>
    <text x="1210" y="618" fill="#56524a">teaches the agent to read them</text>
  </g>
  <line x1="990" y1="640" x2="1534" y2="640" stroke="#d8d2c4" stroke-width="1.5"/>
  <text x="990" y="670" font-size="14.5" fill="#1c1b19">A prompt cannot choose the model that reads it.</text>
  <text x="990" y="696" font-size="14.5" fill="#1c1b19">Continuum works where the request is built.</text>

  <!-- control band -->
  <rect x="46" y="756" width="1508" height="100" rx="10" fill="#ece8dc" stroke="#cfc9bb" stroke-width="2"/>
  <text x="66" y="788" font-size="17" font-weight="700" fill="#1c1b19">YOU STAY IN CONTROL</text>
  <g font-size="14.5" fill="#1c1b19">
    <text x="66" y="816">•  Changes a request only with your consent (llm.model_override)</text>
    <text x="66" y="840">•  Without consent it observes and reports what it would choose</text>
    <text x="596" y="816">•  /continuum pin keeps a session on your own model</text>
    <text x="596" y="840">•  mode: off records nothing and changes nothing</text>
    <text x="1076" y="816">•  Records stay on your machine</text>
    <text x="1076" y="840">•  The export holds fingerprints and outcomes, no text</text>
  </g>
</svg>
