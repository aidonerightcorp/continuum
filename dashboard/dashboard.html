<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>Continuum v1.3.0 — OmniNode-Encased Dashboard</title>
</head>
<body style="margin:0;padding:20px;background:#f5f2ea;color:#141413;font-family:ui-sans-serif,system-ui,sans-serif;">
  <div id="continuum-dashboard-root"></div>
  <script>
    window.registerDashboardPlugin = function (_name, plugin) {
      var el = document.getElementById('continuum-dashboard-root');
      if (el && plugin && typeof plugin.mount === 'function') {
        plugin.mount(el);
      }
    };
  </script>
  <script src="bundle.js"></script>
</body>
</html>
